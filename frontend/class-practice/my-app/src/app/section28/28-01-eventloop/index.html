<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>이벤트 루프 실습</title>
    <script>
      const onClickButton = () => {
        console.log("시작!!!");

        setTimeout(() => {
          console.log("0초 뒤에 실행될 거예여!");
        }, 0);

        let sum = 0;

        for (let i = 0; i <= 900000000; i++) {
          sum += 1;
        }

        console.log("끝!!!");
      };
    </script>
  </head>
  <body>
    <button onclick="onClickButton()">시작하기</button>
  </body>
</html>
